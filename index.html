<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Margins</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #5b4a3a; /* the "desk" behind the page */
        touch-action: none; /* stop the browser from scrolling/zooming on touch */
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      /* Ask phone players to turn their device sideways. */
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        align-items: center;
        justify-content: center;
        background: #f7f3e8;
        color: #333;
        font: 24px 'Comic Sans MS', 'Chalkboard SE', cursive;
        text-align: center;
        padding: 16px;
      }
      @media (orientation: portrait) and (max-width: 900px) {
        #rotate {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">Turn your phone sideways ↻</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
