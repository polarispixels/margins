<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Margins</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #5b4a3a; /* the "desk" behind the page */
        touch-action: none; /* stop the browser from scrolling/zooming on touch */
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      /* Ask phone players to turn their phone the way the current mode wants.
         The game sets <body data-orientation="landscape|portrait">. The hint is a
         wordless drawing: a phone outline that turns to the right way up. */
      #rotate {
        display: none;
        position: fixed;
        inset: 0;
        align-items: center;
        justify-content: center;
        background: #f7f3e8;
      }
      #rotate .phone {
        width: 70px;
        height: 120px;
        border: 4px solid #3a3a3a;
        border-radius: 12px;
        animation: turn-sideways 1.8s ease-in-out infinite;
      }
      [data-orientation='portrait'] #rotate .phone {
        animation-name: turn-upright;
      }
      @keyframes turn-sideways {
        0%, 25% { transform: rotate(0deg); }
        60%, 100% { transform: rotate(-90deg); }
      }
      @keyframes turn-upright {
        0%, 25% { transform: rotate(-90deg); }
        60%, 100% { transform: rotate(0deg); }
      }
      /* Landscape mode held upright on a phone... */
      @media (orientation: portrait) and (max-width: 900px) {
        [data-orientation='landscape'] #rotate {
          display: flex;
        }
      }
      /* ...or portrait mode (Climb) held sideways on a phone. */
      @media (orientation: landscape) and (max-height: 500px) {
        [data-orientation='portrait'] #rotate {
          display: flex;
        }
      }
    </style>
  </head>
  <body data-orientation="landscape">
    <div id="game"></div>
    <div id="rotate" role="img" aria-label="Turn your phone"><div class="phone"></div></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
